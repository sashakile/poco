repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: typos
        name: typos
        entry: typos
        language: system
        types: [text]
        exclude: '^\.vale/styles/'
      - id: beads
        name: beads
        entry: sh -c 'if command -v bd >/dev/null 2>&1; then BD_GIT_HOOK=1 bd hooks run pre-commit "$@"; fi'
        language: system
        always_run: true
        pass_filenames: false
