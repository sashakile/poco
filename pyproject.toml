[project]
name = "poxo"
version = "0.1.0"
description = "Pure Python DataFrame library with algebraic foundations"
readme = "README.md"
license = "MIT"
authors = [
    { name = "sashakile", email = "saxa.kile@gmail.com" },
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/sashakile/poco"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
    "hypothesis",
]
dev = [
    "pylint",
]

[tool.pytest.ini_options]
addopts = "--cov=poxo --cov-report=term-missing"

[tool.coverage.run]
source = ["poxo"]

[tool.coverage.report]
fail_under = 80
show_missing = true
